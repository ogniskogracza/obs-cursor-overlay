<svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">

    <!--
        POINTER ICON CONVENTION
        - viewBox is always "0 0 90 90"
        - the tip of the icon always sits at local (8,8)
          (see the <g transform> below) so every pointer
          file lines up with the mouse coordinate the same way
        - this file is fully self-contained: its own <defs>,
          gradient and glow filter, so it can be swapped in
          on its own with no other changes needed
    -->

    <defs>

        <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#bff4ff"/>
            <stop offset="55%" stop-color="#35cfff"/>
            <stop offset="100%" stop-color="#087fc1"/>
        </linearGradient>

        <filter id="bladeGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <g transform="translate(9 8) rotate(-34)">

        <!-- Blade glow behind the sword -->
        <path
            d="M 0 0 L 2.4 12.5 L 4.6 57 L -4.6 57 L -2.4 12.5 Z"
            fill="#20cfff"
            opacity="0.45"
            filter="url(#bladeGlow)"
        />

        <!-- Main crystal blade (lengthened) -->
        <path
            d="M 0 0 L 2.4 12.5 L 4.6 57 L -4.6 57 L -2.4 12.5 Z"
            fill="url(#bladeGradient)"
            stroke="#063c5c"
            stroke-width="1.2"
            stroke-linejoin="round"
        />

        <!-- Central fuller / highlight -->
        <path
            d="M 0 3 L 1.1 13 L 1.9 55 L 0.4 55 L -0.3 13 Z"
            fill="#ffffff"
            opacity="0.75"
        />

        <!-- Cross-guard -->
        <path
            d="M 0 55 L 3.8 58.5 L 15.5 56.5 L 18 62 L 6 63.5 L 0 68 L -6 63.5 L -18 62 L -15.5 56.5 L -3.8 58.5 Z"
            fill="#bfc7ce"
            stroke="#26343c"
            stroke-width="1.3"
            stroke-linejoin="round"
        />

        <!-- Handle -->
        <path
            d="M -2.4 68 L 2.4 68 L 3 82 L -3 82 Z"
            fill="#252d32"
            stroke="#11181c"
            stroke-width="1.2"
        />

        <path d="M -2.7 72 L 2.7 72.3" stroke="#6c7880" stroke-width="1.4"/>
        <path d="M -2.85 76 L 2.85 76.3" stroke="#6c7880" stroke-width="1.4"/>
        <path d="M -3 80 L 3 80.3" stroke="#6c7880" stroke-width="1.4"/>

        <!-- Pommel -->
        <circle cx="0" cy="89" r="5" fill="#35cfff" stroke="#26343c" stroke-width="1.3"/>
        <circle cx="-1.5" cy="87.3" r="1.5" fill="white" opacity="0.9"/>

    </g>

</svg>
