<svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">

    <!--
        POINTER ICON CONVENTION
        - viewBox is always "0 0 90 90"
        - the tip sits at local (8,8) via the <g transform> below
    -->

    <defs>

        <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#bff4ff"/>
            <stop offset="55%" stop-color="#35cfff"/>
            <stop offset="100%" stop-color="#087fc1"/>
        </linearGradient>

        <filter id="arrowGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <g transform="translate(8 8)">

        <!-- Glow behind the arrow -->
        <path
            d="M 0 0 L 0 51.2 L 12.8 38.4 L 20.8 54.4 L 27.2 51.2 L 19.2 35.2 L 35.2 35.2 Z"
            fill="#20cfff"
            opacity="0.45"
            filter="url(#arrowGlow)"
        />

        <!-- Main arrow body -->
        <path
            d="M 0 0 L 0 51.2 L 12.8 38.4 L 20.8 54.4 L 27.2 51.2 L 19.2 35.2 L 35.2 35.2 Z"
            fill="url(#arrowGradient)"
            stroke="#063c5c"
            stroke-width="1.5"
            stroke-linejoin="round"
        />

        <!-- Bright edge highlight -->
        <path
            d="M 2.2 5 L 2.2 42 L 12.4 33.2"
            fill="none"
            stroke="#ffffff"
            stroke-width="1.6"
            stroke-linecap="round"
            opacity="0.75"
        />

    </g>

</svg>
